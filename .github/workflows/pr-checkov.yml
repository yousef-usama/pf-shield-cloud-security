name: PR Terraform Security Gate (Checkov)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "terraform/**"
      - "terraform-bootstrap/**"
      - ".github/workflows/pr-checkov.yml"

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  checkov-pr-scan:
    name: Checkov Terraform Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pull Request Branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9.0"

      - name: Verify Terraform Formatting
        run: |
          echo "Verifying Terraform code formatting..."
          terraform -chdir=terraform fmt -check -recursive
          if [ -d "terraform-bootstrap" ]; then
            terraform -chdir=terraform-bootstrap fmt -check -recursive
          fi

      - name: Validate Terraform Syntax & Modules
        run: |
          echo "Validating main Terraform configuration..."
          terraform -chdir=terraform init -backend=false
          terraform -chdir=terraform validate
          if [ -d "terraform-bootstrap" ]; then
            echo "Validating bootstrap configuration..."
            terraform -chdir=terraform-bootstrap init -backend=false
            terraform -chdir=terraform-bootstrap validate
          fi

      - name: Set up Python for Checkov
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install Pinned Checkov CLI
        run: pip install checkov==3.2.368

      - name: Run Checkov Static Analysis (Main Infrastructure)
        run: |
          checkov -d terraform/ \
            --framework terraform \
            --output cli \
            --output sarif \
            --output-file-path console,checkov-main.sarif \
            --soft-fail

      - name: Run Checkov Static Analysis (Bootstrap Infrastructure)
        if: hashFiles('terraform-bootstrap/**') != ''
        run: |
          checkov -d terraform-bootstrap/ \
            --framework terraform \
            --output cli \
            --output sarif \
            --output-file-path console,checkov-bootstrap.sarif \
            --soft-fail

      - name: Upload PR Checkov SARIF Results
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: checkov-main.sarif/results_sarif.sarif
        continue-on-error: true
