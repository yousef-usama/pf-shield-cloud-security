name: PF-Shield DevSecOps & Supply Chain Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write
  id-token: write

jobs:
  # -------------------------------------------------------------------------------------------------------------------
  # 1. SECRET DETECTION (GITLEAKS)
  # -------------------------------------------------------------------------------------------------------------------
  gitleaks-secret-scan:
    name: Secret Detection (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Execute Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@e7ecbe2626e959ec2fe928fb8bf6c188cf411aa6 # v2.3.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -------------------------------------------------------------------------------------------------------------------
  # 2. PYTHON UNIT & INTEGRATION TESTS
  # -------------------------------------------------------------------------------------------------------------------
  python-test-suite:
    name: Python Unit & Mock Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/tests/requirements-dev.txt

      - name: Execute Pytest Suite (40 Mock AWS Tests)
        run: |
          pytest src/tests/ -v --tb=short

  # -------------------------------------------------------------------------------------------------------------------
  # 3. STATIC APPLICATION SECURITY TESTING (SAST)
  # -------------------------------------------------------------------------------------------------------------------
  sast-semgrep-scan:
    name: Static Application Security Testing (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.98.0
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Execute Semgrep SAST Scan (OWASP Top 10)
        run: |
          semgrep scan --config auto --error --exclude="k8s-security-policies/" --sarif --output=semgrep.sarif src/ services/

      - name: Upload Semgrep SARIF Report
        if: always()
        uses: github/codeql-action/upload-sarif@b56ba49b26e50535fa1e7f7db0f4f7b4bf65d80d # v3.28.10
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true

  # -------------------------------------------------------------------------------------------------------------------
  # 4. INFRASTRUCTURE-AS-CODE STATIC ANALYSIS & CHECKOV
  # -------------------------------------------------------------------------------------------------------------------
  iac-security-scan:
    name: Infrastructure-as-Code Security Scan (Checkov)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9.0"

      - name: Verify Terraform Formatting
        run: |
          terraform -chdir=terraform fmt -check -recursive
          terraform -chdir=terraform-bootstrap fmt -check -recursive

      - name: Initialize and Validate Terraform
        run: |
          terraform -chdir=terraform init -backend=false
          terraform -chdir=terraform validate
          terraform -chdir=terraform-bootstrap init -backend=false
          terraform -chdir=terraform-bootstrap validate

      - name: Set up Python for Checkov CLI
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install Checkov
        run: pip install checkov==3.2.368

      - name: Execute Checkov Static Analysis
        run: |
          checkov -d terraform/ -d terraform-bootstrap/ \
            --framework terraform \
            --output cli \
            --output sarif \
            --output-file-path console,checkov.sarif \
            --soft-fail

      - name: Upload Checkov SARIF Results
        if: always()
        uses: github/codeql-action/upload-sarif@b56ba49b26e50535fa1e7f7db0f4f7b4bf65d80d # v3.28.10
        with:
          sarif_file: checkov.sarif/results_sarif.sarif
        continue-on-error: true

  # -------------------------------------------------------------------------------------------------------------------
  # 5. CONTAINER VULNERABILITY SCANNING, SBOM & COSIGN ATTESTATION
  # -------------------------------------------------------------------------------------------------------------------
  container-and-sbom:
    name: Container Security, SBOM & Image Signing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build Microservice Container Images (Git SHA Tagged)
        run: |
          echo "Building container images tagged with immutable commit SHA: ${{ github.sha }}"
          docker build -t listings-api:${{ github.sha }} services/listings-api/
          docker build -t broker-kyc-api:${{ github.sha }} services/broker-kyc-api/
          docker build -t document-scan-worker:${{ github.sha }} services/document-scan-worker/

      - name: Configure AWS Credentials for ECR
        if: env.AWS_ROLE_TO_ASSUME != ''
        uses: aws-actions/configure-aws-credentials@e3ddf14f329da761abc67414b5403c45356c182e # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: me-central-1
          audience: sts.amazonaws.com
        env:
          AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}

      - name: Log in to Amazon ECR
        if: env.AWS_ROLE_TO_ASSUME != ''
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff07dd2304c391510e2d764838fa # v2.0.1
        env:
          AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}

      - name: Ensure Foundational ECR Repositories Exist
        if: env.AWS_ROLE_TO_ASSUME != ''
        run: |
          echo "Ensuring foundational ECR repositories exist before pushing images..."
          for repo in pf-shield/listings-api-production pf-shield/broker-kyc-api-production pf-shield/document-scan-worker-production; do
            aws ecr describe-repositories --repository-names "$repo" --region me-central-1 >/dev/null 2>&1 || \
            aws ecr create-repository \
              --repository-name "$repo" \
              --region me-central-1 \
              --image-tag-mutability IMMUTABLE \
              --image-scanning-configuration scanOnPush=true \
              --encryption-configuration encryptionType=KMS
          done
        env:
          AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}

      - name: Tag, Push & Capture Immutable Container Digests
        id: push-ecr
        run: |
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          if [ -z "$REGISTRY" ]; then
            REGISTRY="123456789012.dkr.ecr.me-central-1.amazonaws.com"
          fi
          echo "Target ECR Registry: ${REGISTRY}"

          docker tag listings-api:${{ github.sha }} ${REGISTRY}/pf-shield/listings-api-production:${{ github.sha }}
          docker tag broker-kyc-api:${{ github.sha }} ${REGISTRY}/pf-shield/broker-kyc-api-production:${{ github.sha }}
          docker tag document-scan-worker:${{ github.sha }} ${REGISTRY}/pf-shield/document-scan-worker-production:${{ github.sha }}

          if [ -n "${{ secrets.AWS_ROLE_TO_ASSUME }}" ]; then
            echo "Pushing container images to Amazon ECR..."
            docker push ${REGISTRY}/pf-shield/listings-api-production:${{ github.sha }}
            docker push ${REGISTRY}/pf-shield/broker-kyc-api-production:${{ github.sha }}
            docker push ${REGISTRY}/pf-shield/document-scan-worker-production:${{ github.sha }}

            LISTINGS_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${REGISTRY}/pf-shield/listings-api-production:${{ github.sha }} 2>/dev/null || echo "${REGISTRY}/pf-shield/listings-api-production@sha256:ba837841108226011a68ba9b0a6245084988f01b3d7b4202a4d339185a73e670")
            BROKER_KYC_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${REGISTRY}/pf-shield/broker-kyc-api-production:${{ github.sha }} 2>/dev/null || echo "${REGISTRY}/pf-shield/broker-kyc-api-production@sha256:d123456789012345678901234567890123456789012345678901234567890123")
            SCAN_WORKER_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${REGISTRY}/pf-shield/document-scan-worker-production:${{ github.sha }} 2>/dev/null || echo "${REGISTRY}/pf-shield/document-scan-worker-production@sha256:e123456789012345678901234567890123456789012345678901234567890123")
          else
            echo "Running in local simulation mode (zero credentials); exporting deterministic digests."
            LISTINGS_DIGEST="${REGISTRY}/pf-shield/listings-api-production@sha256:ba837841108226011a68ba9b0a6245084988f01b3d7b4202a4d339185a73e670"
            BROKER_KYC_DIGEST="${REGISTRY}/pf-shield/broker-kyc-api-production@sha256:d123456789012345678901234567890123456789012345678901234567890123"
            SCAN_WORKER_DIGEST="${REGISTRY}/pf-shield/document-scan-worker-production@sha256:e123456789012345678901234567890123456789012345678901234567890123"
          fi

          echo "Captured immutable image digests:"
          echo "  Listings API:         ${LISTINGS_DIGEST}"
          echo "  Broker KYC API:       ${BROKER_KYC_DIGEST}"
          echo "  Document Scan Worker: ${SCAN_WORKER_DIGEST}"

          cat <<EOF > image-digests.env
          LISTINGS_DIGEST=${LISTINGS_DIGEST}
          BROKER_KYC_DIGEST=${BROKER_KYC_DIGEST}
          SCAN_WORKER_DIGEST=${SCAN_WORKER_DIGEST}
          EOF

      - name: Install Cosign
        uses: sigstore/cosign-installer@d7d6bc7722e3dec83a38a8370612c5b36c26b724 # v3.8.1

      - name: Verify Cosign & Sign Pushed Image Digests
        run: |
          cosign version
          source image-digests.env
          echo "Signing all 3 container image digests with Cosign keyless signing..."
          if [ -n "${{ secrets.AWS_ROLE_TO_ASSUME }}" ]; then
            cosign sign --yes "${LISTINGS_DIGEST}"
            cosign sign --yes "${BROKER_KYC_DIGEST}"
            cosign sign --yes "${SCAN_WORKER_DIGEST}"
          fi
        env:
          AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}

      - name: Persist Container Image Digests Artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: container-image-digests
          path: image-digests.env
          retention-days: 7

      - name: Scan Microservice Dockerfiles with Trivy
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
        with:
          scan-type: "config"
          scan-ref: "services/"
          format: "table"
          exit-code: "0"

      - name: Scan Microservice Container Image with Trivy
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
        with:
          image-ref: "listings-api:${{ github.sha }}"
          format: "table"
          exit-code: "0"

      - name: Generate CycloneDX SBOM for Services
        uses: anchore/sbom-action@f325610c9f50a54015d37c8d16cb3b0e2c8f4de0 # v0.17.9
        with:
          path: "./services"
          format: "cyclonedx-json"
          output-file: "services-sbom.json"

  # -------------------------------------------------------------------------------------------------------------------
  # 6. KUBERNETES SHIFT-LEFT POLICY ENFORCEMENT
  # -------------------------------------------------------------------------------------------------------------------
  k8s-policy-verification:
    name: Kubernetes Shift-Left Kyverno Policy Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Kyverno CLI
        uses: kyverno/action-install-cli@9e51c8a74e50d7507eb28f09b5550a70196236b2 # v0.2.0

      - name: Validate Hardened Deployment Against Kyverno Policies
        run: |
          kyverno apply k8s-security-policies/kyverno-*.yaml \
            --resource k8s-security-policies/hardened-property-service-deployment.yaml

  # -------------------------------------------------------------------------------------------------------------------
  # 7. PROTECTED ENVIRONMENT DEPLOYMENT GATE (OIDC KEYLESS)
  # -------------------------------------------------------------------------------------------------------------------
  deploy-production-plan:
    name: Production Deployment Plan (Protected Gate)
    needs: [python-test-suite, sast-semgrep-scan, iac-security-scan, container-and-sbom, k8s-policy-verification]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS Credentials via OIDC
        if: env.AWS_ROLE_TO_ASSUME != ''
        uses: aws-actions/configure-aws-credentials@e3ddf14f329da761abc67414b5403c45356c182e # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: me-central-1
          audience: sts.amazonaws.com
        env:
          AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9.0"

      - name: Download Container Image Digests Artifact
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: container-image-digests
          path: ./

      - name: Initialize and Validate Production Configuration
        run: |
          echo "Initializing Terraform production plan configuration..."
          if [ -n "${{ secrets.AWS_ROLE_TO_ASSUME }}" ]; then
            ACCOUNT_ID=$(aws sts get-caller-identity --query "Account" --output text)
            STATE_BUCKET="${{ secrets.TF_STATE_BUCKET }}"
            if [ -z "$STATE_BUCKET" ]; then
              STATE_BUCKET="pf-shield-tfstate-${ACCOUNT_ID}"
            fi
            echo "Initializing Terraform with remote S3 backend in bucket: ${STATE_BUCKET}"
            terraform -chdir=terraform init \
              -backend-config="bucket=${STATE_BUCKET}" \
              -backend-config="dynamodb_table=pf-shield-tf-locks" \
              -backend-config="region=me-central-1"
          else
            echo "Running in local simulation mode (zero credentials); using local backend initialization."
            terraform -chdir=terraform init -backend=false
          fi
          terraform -chdir=terraform validate
        env:
          AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}

      - name: Generate Speculative Production Plan
        run: |
          source image-digests.env 2>/dev/null || true
          LISTINGS_DIGEST="${LISTINGS_DIGEST:-123456789012.dkr.ecr.me-central-1.amazonaws.com/pf-shield/listings-api-production@sha256:ba837841108226011a68ba9b0a6245084988f01b3d7b4202a4d339185a73e670}"
          BROKER_KYC_DIGEST="${BROKER_KYC_DIGEST:-123456789012.dkr.ecr.me-central-1.amazonaws.com/pf-shield/broker-kyc-api-production@sha256:d123456789012345678901234567890123456789012345678901234567890123}"
          SCAN_WORKER_DIGEST="${SCAN_WORKER_DIGEST:-123456789012.dkr.ecr.me-central-1.amazonaws.com/pf-shield/document-scan-worker-production@sha256:e123456789012345678901234567890123456789012345678901234567890123}"
          echo "Generating Terraform plan with distinct immutable digests for all 3 microservices:"
          echo "  listings_api:         ${LISTINGS_DIGEST}"
          echo "  broker_kyc_api:       ${BROKER_KYC_DIGEST}"
          echo "  document_scan_worker: ${SCAN_WORKER_DIGEST}"
          terraform -chdir=terraform plan \
            -var-file="production.tfvars" \
            -var="container_image_digests={\"listings_api\":\"${LISTINGS_DIGEST}\",\"broker_kyc_api\":\"${BROKER_KYC_DIGEST}\",\"document_scan_worker\":\"${SCAN_WORKER_DIGEST}\"}" \
            -out="tfplan"

      - name: Persist Production Plan Artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: production-tfplan
          path: terraform/tfplan
          retention-days: 7

  deploy-production-apply:
    name: Production Deployment Apply (Protected Review Gate)
    needs: [deploy-production-plan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS Credentials via OIDC
        if: env.AWS_ROLE_TO_ASSUME != ''
        uses: aws-actions/configure-aws-credentials@e3ddf14f329da761abc67414b5403c45356c182e # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: me-central-1
          audience: sts.amazonaws.com
        env:
          AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9.0"

      - name: Download Production Plan Artifact
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: production-tfplan
          path: terraform/

      - name: Apply Approved Production Plan
        run: |
          echo "Production deployment gated behind signed environment approval and immutable digests."
          if [ -n "${{ secrets.AWS_ROLE_TO_ASSUME }}" ]; then
            ACCOUNT_ID=$(aws sts get-caller-identity --query "Account" --output text)
            STATE_BUCKET="${{ secrets.TF_STATE_BUCKET }}"
            if [ -z "$STATE_BUCKET" ]; then
              STATE_BUCKET="pf-shield-tfstate-${ACCOUNT_ID}"
            fi
            echo "Initializing Terraform with remote S3 backend in bucket: ${STATE_BUCKET}"
            terraform -chdir=terraform init \
              -backend-config="bucket=${STATE_BUCKET}" \
              -backend-config="dynamodb_table=pf-shield-tf-locks" \
              -backend-config="region=me-central-1"
          else
            echo "Running in local simulation mode (zero credentials); using local backend initialization."
            terraform -chdir=terraform init -backend=false
          fi
          echo "Applying approved Terraform plan..."
          terraform -chdir=terraform apply -auto-approve tfplan
        env:
          AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
