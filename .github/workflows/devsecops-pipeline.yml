name: PF-Shield DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  unit-test-soar:
    name: SOAR Playbooks Unit Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/tests/requirements-dev.txt

      - name: Execute Pytest Suite (Moto AWS Mocking)
        run: |
          pytest src/tests/ -v --tb=short

  iac-security-scan:
    name: Infrastructure-as-Code Static Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Verify Terraform Formatting
        run: |
          terraform -chdir=terraform fmt -check -recursive

      - name: Initialize and Validate Terraform
        run: |
          terraform -chdir=terraform init -backend=false
          terraform -chdir=terraform validate

      - name: Execute Checkov Policy-as-Code Security Scan
        uses: bridgecrewio/checkov-action@master
        with:
          framework: terraform
          directory: terraform/
          output_format: cli
          soft_fail: false

  k8s-policy-verification:
    name: Kubernetes Shift-Left Kyverno Policy Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Kyverno CLI
        uses: kyverno/action-install-cli@v0.2.0

      - name: Validate Hardened Deployment Against Kyverno Policies
        run: |
          kyverno apply k8s-security-policies/kyverno-*.yaml \
            --resource k8s-security-policies/hardened-property-service-deployment.yaml
